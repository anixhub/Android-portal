name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/PortalAlumni-Attaroqqy.apk
          echo "APK successfully generated at build-artifacts/PortalAlumni-Attaroqqy.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortalAlumni-Attaroqqy-APK
          path: build-artifacts/PortalAlumni-Attaroqqy.apk
          retention-days: 30

      - name: Create GitHub Release (Optional on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/PortalAlumni-Attaroqqy.apk
          generate_release_notes: true
