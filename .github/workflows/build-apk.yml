name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/PortalAlumni-Attaroqqy.apk
          echo "APK ready in output-apk/"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortalAlumni-Attaroqqy-APK
          path: output-apk/PortalAlumni-Attaroqqy.apk
          retention-days: 30
