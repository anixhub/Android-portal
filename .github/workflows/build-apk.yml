name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Setup Android SDK Licenses & Platforms
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        if: success()
        run: |
          mkdir -p output-apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/PortalAlumni-Attaroqqy.apk \;
          echo "APK berhasil dibuat:"
          ls -la output-apk/

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PortalAlumni-Attaroqqy-APK
          path: output-apk/PortalAlumni-Attaroqqy.apk
          retention-days: 30
